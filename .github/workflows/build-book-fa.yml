name: "📖 Build Book — فارسی"

on:
  workflow_dispatch:
    inputs:
      gemini_api_key:
        description: "API Google AI (Gemini). می‌توانید به‌جای این فیلد، سکرت GEMINI_API_KEY را در ریپو ست کنید."
        required: false
        type: string
      book_name:
        description: "نام کتاب (به هر زبانی — فارسی یا انگلیسی)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Mask API key in logs
        if: ${{ inputs.gemini_api_key != '' }}
        run: echo "::add-mask::${{ inputs.gemini_api_key }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Generate Persian book
        working-directory: scripts
        env:
          GEMINI_KEY: ${{ inputs.gemini_api_key != '' && inputs.gemini_api_key || secrets.GEMINI_API_KEY }}
        run: |
          python generate_book.py \
            --lang fa \
            --title "${{ inputs.book_name }}" \
            --api-key "$GEMINI_KEY" \
            --github-url "https://github.com/${{ github.repository }}"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-fa-${{ github.run_number }}
          path: output/*-fa.pdf
